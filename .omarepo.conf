# omarepo settings for this app. Read as KEY=value, never run.
# "omarepo publish <tag>" in this checkout, or a deployment's Publish
# workflow, reads it from the tag being released.
#
# Guessed by omarepo init:
#   GITHUB_REPO from the origin remote
#   ARCH_PKG from pkgbuild/PKGBUILD
#   FLATPAK_ID from flatpak/io.github.kjlape.Needful.yml
#   MACOS_NAME from bin/build-macos

# The app's name in a deployment's bucket: macos/<APP>/, apps/<APP>.conf.
# Lowercase.
APP=needful
APP_TITLE="Needful"
SUMMARY="Routine tasks, most needful first"
# Whose GitHub releases hold the builds.
GITHUB_REPO=kjlape/needful

# Leave a format empty if the app doesn't ship it.
# The pacman package's pkgname; the release has <pkgname>-<version>-*.pkg.tar.zst.
ARCH_PKG=lape-needful
# The Flatpak app ID; the release has a *.flatpak bundle of it.
FLATPAK_ID=io.github.kjlape.Needful
# The release has <MACOS_NAME>-<version>.dmg (or .zip), notarized. The app's
# SUFeedURL is <deployment's BASE_URL>/macos/needful/appcast.xml, so a Mac
# build updates from one deployment.
MACOS_NAME=Needful
# The Keychain account of the Sparkle key the app's SUPublicEDKey pins,
# if not the deployment's.
SPARKLE_ACCOUNT=
