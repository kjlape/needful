[package]
name = "needful-link"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[dependencies]
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
iroh-mdns-address-lookup = "0.6.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spake2 = "0.4"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
anyhow = "1"
libc = "0.2"
n0-future = "0.3"

[dev-dependencies]
# A relay to pair through in the tests.
iroh-relay = { version = "1.4.1", features = ["server"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
